<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#0E1015;
  color:#F3F4F7;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
:root{
  --bg:#0E1015;
  --surface:rgba(255,255,255,0.05);
  --surface-strong:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.09);
  --text:#F3F4F7;
  --text-dim:#8A8F99;
  --text-faint:#5B5F69;
  --cal-a:#FF7A59;
  --cal-b:#FFC15E;
  --protein:#A78BFA;
  --carbs:#38BDF8;
  --fat:#FBBF24;
  --success:#34D399;
  --danger:#FB7185;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(600px 300px at 15% -5%, rgba(255,122,89,0.16), transparent 60%),
    radial-gradient(500px 260px at 100% 0%, rgba(56,189,248,0.10), transparent 55%),
    var(--bg);
  padding-bottom:110px;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{display:none;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 20px 6px;
}
.greeting{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:-0.3px;
}
.date-label{
  font-size:12.5px;
  color:var(--text-dim);
  margin-top:2px;
}
.date-switch{display:flex; gap:8px;}
.icon-round{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.icon-round:active{transform:scale(0.9); background:var(--surface-strong);}
.icon-round svg{width:16px;height:16px;}
.icon-round[disabled]{opacity:0.25; pointer-events:none;}

/* ---------- generic ---------- */
.view{padding:8px 18px 4px;}
.hidden{display:none !important;}
.fade-in{animation:fadeUp .38s cubic-bezier(.2,.8,.25,1) both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.glass{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  backdrop-filter:blur(14px);
}

/* ---------- ring card ---------- */
.ring-card{
  padding:22px 20px 20px;
  margin-bottom:16px;
  text-align:center;
}
.ring-wrap{position:relative; width:190px; height:190px; margin:4px auto 6px;}
.ring-wrap svg{width:100%; height:100%;}
.ring-progress{transition:stroke-dashoffset 1s cubic-bezier(.25,.8,.3,1);}
.ring-center{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:38px;
  line-height:1;
  letter-spacing:-1px;
}
.ring-sub{
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:6px;
  font-weight:500;
}
.ring-sub.over{color:var(--danger);}
.ring-sub.met{color:var(--success);}
.pill-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.pill{
  flex:1;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:10px 10px 11px;
  text-align:left;
}
.pill-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10.5px;
  color:var(--text-dim);
  font-weight:600;
  margin-bottom:6px;
}
.pill-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.pill-val{font-size:12.5px; font-weight:700; color:var(--text);}
.pill-track{
  height:5px;
  border-radius:4px;
  background:rgba(255,255,255,0.07);
  overflow:hidden;
}
.pill-fill{height:100%; border-radius:4px; transition:width .9s cubic-bezier(.25,.8,.3,1); width:0%;}

/* ---------- meal groups ---------- */
.weight-card{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; margin-bottom:14px;
}
.weight-left{display:flex; align-items:center; gap:11px;}
.weight-icon{
  width:38px; height:38px; border-radius:11px;
  background:rgba(56,189,248,0.15); color:var(--carbs);
  display:flex; align-items:center; justify-content:center;
}
.weight-icon svg{width:18px; height:18px;}
.weight-val{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:17px;}
.weight-sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
.copy-yesterday-btn{
  width:100%;
  padding:11px;
  border-radius:var(--r-md);
  border:1px dashed rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.02);
  color:var(--text-dim);
  font-size:12.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:7px;
  cursor:pointer;
  margin-bottom:14px;
}
.copy-yesterday-btn svg{width:14px; height:14px;}
.copy-yesterday-btn:active{background:rgba(255,255,255,0.05);}
.weight-unit-select{display:flex; gap:7px; margin:12px 0 4px;}
.meal-group{margin-bottom:14px; padding:14px 14px 6px;}
.meal-group-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  padding:0 2px;
}
.meal-title-row{display:flex; align-items:center; gap:8px;}
.meal-emoji{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
}
.meal-title{font-size:14.5px; font-weight:700;}
.meal-cal{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.meal-add{
  width:30px;height:30px;
  border-radius:50%;
  background:var(--surface-strong);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.meal-add svg{width:14px;height:14px;}
.meal-add:active{transform:scale(0.88);}

.entry-row{
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 2px;
  border-top:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.meal-group .entry-row:first-of-type{border-top:none;}
.entry-thumb{
  width:42px;height:42px;border-radius:12px;
  object-fit:cover;
  flex-shrink:0;
  background:var(--surface-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
}
.entry-main{flex:1; min-width:0;}
.entry-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.entry-portion{font-size:11px; color:var(--text-dim); margin-top:1px;}
.entry-cal{font-size:13px; font-weight:700; white-space:nowrap;}
.entry-del{
  width:26px;height:26px;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.entry-del svg{width:13px;height:13px;}
.entry-del:active{color:var(--danger);}
.meal-empty{
  padding:10px 2px 12px;
  font-size:12px;
  color:var(--text-faint);
}

/* ---------- weekly ---------- */
.section-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:-0.3px;
  margin:10px 2px 2px;
}
.section-sub{font-size:12px; color:var(--text-dim); margin:0 2px 14px;}
.chart-card{padding:18px 14px 10px; margin-bottom:14px;}
.chart-legend{font-size:10.5px; color:var(--text-dim); text-align:center; margin-top:8px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.stat-tile{padding:14px;}
.stat-icon{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;
}
.stat-icon svg{width:15px;height:15px;}
.stat-num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px;}
.stat-label{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

/* ---------- goals ---------- */
.form-card{padding:20px; margin-bottom:14px;}
.form-card h3{font-size:14px; font-weight:700; margin:0 0 4px;}
.form-card .form-sub{font-size:11.5px; color:var(--text-dim); margin-bottom:16px;}
.slider-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:34px;
  text-align:center;
  margin-bottom:10px;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
select option{
  color:#111827 !important;
  background:#ffffff !important;
}
input[type=range]{
  width:100%;
  -webkit-appearance:none;
  height:6px;
  border-radius:4px;
  background:rgba(255,255,255,0.08);
  margin-bottom:4px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;height:22px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  border:3px solid #0E1015;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,0.15);
}
.range-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--text-faint); margin-bottom:18px;}
.stepper-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 4px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.form-card .stepper-row:first-of-type{border-top:none;}
.stepper-label{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;}
.stepper-controls{display:flex; align-items:center; gap:10px;}
.stepper-btn{
  width:28px;height:28px;
  border-radius:50%;
  background:var(--surface-strong);
  border:1px solid var(--border);
  color:var(--text);
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.stepper-btn:active{transform:scale(0.88);}
.stepper-val{
  font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14px;
  width:52px; text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:6px 2px;
  -moz-appearance:textfield;
}
.stepper-val::-webkit-outer-spin-button, .stepper-val::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0;
}
.stepper-val:focus{outline:none; border-color:var(--cal-b);}
.btn-primary{
  width:100%;
  padding:14px;
  border:none;
  border-radius:var(--r-md);
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  color:#1A1206;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:14px;
  letter-spacing:0.2px;
  cursor:pointer;
  margin-top:8px;
}
.btn-primary:active{transform:scale(0.98);}
.btn-ghost{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:var(--r-md);
  background:transparent;
  color:var(--text-dim);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.link-danger{
  display:block;
  text-align:center;
  font-size:12.5px;
  color:var(--danger);
  margin-top:14px;
  cursor:pointer;
  opacity:0.85;
}

/* ---------- bottom nav + fab ---------- */
.bottom-nav{
  position:fixed;
  bottom:0; left:0; right:0;
  max-width:480px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(18,20,26,0.85);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding:10px 4px calc(10px + env(safe-area-inset-bottom));
  z-index:30;
}
.nav-btn{
  background:none; border:none; color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:9.5px; font-weight:600;
  padding:4px 6px;
  flex:1;
  min-width:0;
  cursor:pointer;
}
.nav-btn svg{width:19px;height:19px;}
.nav-btn.active{color:var(--text);}
.nav-btn.active svg{color:var(--cal-b);}
.fab{
  position:fixed;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  width:56px;height:56px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  color:#1A1206;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(255,122,89,0.35);
  cursor:pointer;
  z-index:31;
  transition:transform .15s ease;
}
.fab:active{transform:translateX(-50%) scale(0.92);}
.fab svg{width:24px;height:24px;}

/* ---------- bottom sheet modal ---------- */
.sheet-overlay{
  position:fixed; inset:0;
  background:rgba(6,7,10,0.6);
  backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:60;
  animation:overlayIn .25s ease both;
}
@keyframes overlayIn{from{opacity:0;} to{opacity:1;}}
.sheet{
  width:100%; max-width:480px;
  max-height:90vh;
  overflow-y:auto;
  background:#15171E;
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  animation:sheetUp .35s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{
  width:38px; height:4px; border-radius:3px;
  background:rgba(255,255,255,0.18);
  margin:6px auto 14px;
}
.sheet-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800; font-size:17px;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.sheet-close{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface-strong); border:none; color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.sheet-close svg{width:14px;height:14px;}

.capture-box{
  border:1.5px dashed rgba(255,255,255,0.18);
  border-radius:var(--r-lg);
  padding:36px 16px;
  text-align:center;
  cursor:pointer;
  background:rgba(255,255,255,0.02);
}
.capture-box:active{background:rgba(255,255,255,0.05);}
.capture-icon{
  width:52px;height:52px;border-radius:50%;

}
.capture-icon svg{width:22px;height:22px; color:var(--cal-b);}
.capture-text{font-size:13.5px; font-weight:700;}
.capture-hint{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.manual-link{
  display:block; text-align:center; margin-top:14px;
  font-size:12.5px; color:var(--text-dim); text-decoration:underline; cursor:pointer;
}

.preview-img{

}
.skeleton-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.skeleton-block{
  border-radius:8px;
  background:linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 37%, rgba(255,255,255,0.05) 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}
.loading-label{
  text-align:center; font-size:12.5px; color:var(--text-dim);
  margin-top:6px; font-weight:600;
}
.error-box{
  background:rgba(251,113,133,0.12);
  border:1px solid rgba(251,113,133,0.3);
  color:#FCA5B1;
  padding:11px 13px;
  border-radius:var(--r-md);
  font-size:12.5px;
  margin-bottom:12px;
}

.meal-select{display:flex; gap:7px; margin-bottom:16px;}
.meal-chip{
  flex:1;

  padding:9px 4px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  font-size:11.5px; font-weight:700;
  cursor:pointer;
  color:var(--text-dim);
}
.meal-chip.active{
  background:linear-gradient(135deg, rgba(255,122,89,0.9), rgba(255,193,94,0.9));
  color:#1A1206;
  border-color:transparent;
}
.field{margin-bottom:12px;}
.field label{
  display:block; font-size:11px; font-weight:600;
  color:var(--text-dim); margin-bottom:5px; letter-spacing:0.2px;
}
.field input{
  width:100%;
  padding:11px 12px;
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
}
.field input:focus{outline:none; border-color:var(--cal-b);}
.macro-input-row{display:flex; gap:10px;}
.macro-input-row .field{flex:1;}
.items-note{
  font-size:12px; color:var(--text-dim);
  background:rgba(255,255,255,0.03);
  border-radius:var(--r-sm);
  padding:9px 11px;
  margin-bottom:14px;
  line-height:1.5;
}

.toast{
  position:fixed;
  bottom:96px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(25,27,34,0.95);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 18px;
  border-radius:30px;
  font-size:12.5px;
  font-weight:600;
  z-index:100;
  animation:toastIn .3s cubic-bezier(.2,.9,.25,1) both;
  display:flex; align-items:center; gap:7px;
}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
.toast.out{animation:toastOut .25s ease forwards;}
@keyframes toastOut{to{opacity:0; transform:translateX(-50%) translateY(10px);}}

.loading-screen{
  padding:70px 20px; text-align:center;
  color:var(--text-dim); font-size:13px; font-weight:600;
}

@media (prefers-reduced-motion: reduce){
  .fade-in, .sheet, .sheet-overlay, .toast{animation:none !important;}
  .ring-progress, .pill-fill{transition:none !important;}
  .skeleton-block{animation:none !important;}
}

function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function shiftDate(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return localDateStr(d);
}
function friendlyDate(dateStr){
  const today = localDateStr(new Date());
  const yesterday = shiftDate(today,-1);
  if(dateStr===today) return 'Today';
  if(dateStr===yesterday) return 'Yesterday';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
}
function shortDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function dayAbbr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
}
function greetingForNow(){
  const h = new Date().getHours();
  if(h<5) return tr('greet_late');
  if(h<12) return tr('greet_morning');
  if(h<17) return tr('greet_afternoon');
  if(h<21) return tr('greet_evening');
  return tr('greet_night');
}

// ---------- storage ----------
// Uses Claude's window.storage when running inside a Claude artifact view.
// Falls back to the browser's own localStorage when opened as a standalone
// page (e.g. added to the home screen and launched directly via Chrome),
// since window.storage only exists inside Claude's sandbox.
const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ const r = await window.storage.get(key); return (r && r.value) ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem('calorieSnap:'+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, value); }catch(e){ console.error('save failed', e); }
    return;
  }
  try{ localStorage.setItem('calorieSnap:'+key, value); }catch(e){ console.error('save failed', e); }
}

function entriesForDate(dateStr){ return entries.filter(e=>e.date===dateStr); }
function totalsFor(list){
  return list.reduce((acc,e)=>{
    acc.calories += Number(e.calories)||0;
    acc.protein += Number(e.protein)||0;
    acc.carbs += Number(e.carbs)||0;
    acc.fat += Number(e.fat)||0;
    return acc;
  },{calories:0,protein:0,carbs:0,fat:0});
}
function last7Dates(endDateStr){
  const arr=[]; for(let i=6;i>=0;i--) arr.push(shiftDate(endDateStr,-i)); return arr;

// ---------- weight helpers ----------
function kgToLb(kg){ return kg*2.20462; }
function lbToKg(lb){ return lb/2.20462; }
function kgToDisplay(kg, unit){ return unit==='lb' ? kgToLb(kg) : kg; }
function displayToKg(val, unit){ return unit==='lb' ? lbToKg(val) : val; }
function weightForDate(dateStr){ return weights.find(w=>w.date===dateStr) || null; }
function latestWeight(){
  if(weights.length===0) return null;
  return [...weights].sort((a,b)=> a.date < b.date ? 1 : -1)[0];
}
async function upsertWeight(dateStr, kg){
  const idx = weights.findIndex(w=>w.date===dateStr);
  if(idx>-1) weights[idx] = { date: dateStr, kg };
  else weights.push({ date: dateStr, kg });
  await saveWeightsToStorage(weights);
}
async function deleteWeightForDate(dateStr){
  weights = weights.filter(w=>w.date!==dateStr);
  await saveWeightsToStorage(weights);
}
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- image resize ----------
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- count-up animation ----------
function animateNumber(el, target, duration){
  if(REDUCE_MOTION || !el){ if(el) el.textContent = Math.round(target); return; }
  const start = 0;
  const startTime = performance.now();
  function tick(now){
    const p = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(start + (target-start)*eased);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function renderWeekly(){
  const dates = last7Dates(currentDate);
  const dayTotals = dates.map(d=>totalsFor(entriesForDate(d)));
  const maxCal = Math.max(goals.calories, ...dayTotals.map(t=>t.calories), 1);
  const chartH = 120, barW = 24, gap = 12;
  const svgW = dates.length*(barW+gap)+gap;
  const goalY = chartH - Math.min(chartH, (goals.calories/maxCal)*chartH);

  const bars = dates.map((d,i)=>{
    const cal = dayTotals[i].calories;
    const h = Math.max(3, (cal/maxCal)*chartH);
    const x = gap + i*(barW+gap);
    const isToday = d===localDateStr(new Date());
    const over = cal>goals.calories;
    const fill = over ? 'var(--danger)' : 'url(#barGrad)';
    return `<rect class="wbar" data-h="${h}" x="${x}" y="${chartH}" width="${barW}" height="0" rx="7" fill="${fill}"></rect>
    <text x="${x+barW/2}" y="${chartH+18}" text-anchor="middle" font-size="9.5" font-weight="${isToday?'800':'500'}" fill="${isToday?'#F3F4F7':'#5B5F69'}" font-family="Inter, sans-serif">${dayAbbr(d)}</text>`;
  }).join('');

  const weekEntries = entries.filter(e=>dates.includes(e.date));
  const avg = totalsFor(weekEntries);
  const avgCal = Math.round(avg.calories/7);
  const avgProtein = Math.round(avg.protein/7);
  const avgCarbs = Math.round(avg.carbs/7);
  const avgFat = Math.round(avg.fat/7);
  const daysMet = dayTotals.filter(t=>t.calories>0 && t.calories<=goals.calories).length;

  // weight trend
  const weightPoints = dates.map(d=>weightForDate(d)).map((w,i)=> w ? { i, kg: w.kg } : null).filter(Boolean);
  const wChartH = 70, wChartW = svgW;
  let weightChartHtml = '';
  if(weightPoints.length>=2){
    const kgVals = weightPoints.map(p=>p.kg);
    const minKg = Math.min(...kgVals), maxKg = Math.max(...kgVals);
    const range = Math.max(0.5, maxKg-minKg);
    const xFor = i => gap + i*(barW+gap) + barW/2;
    const yFor = kg => wChartH - ((kg-minKg)/range)*wChartH*0.8 - wChartH*0.1;
    const pathPoints = weightPoints.map(p=>`${xFor(p.i)},${yFor(p.kg)}`).join(' ');
    const dots = weightPoints.map(p=>`<circle cx="${xFor(p.i)}" cy="${yFor(p.kg)}" r="3.5" fill="var(--carbs)"/>`).join('');
    const first = weightPoints[0].kg, last = weightPoints[weightPoints.length-1].kg;
    const change = last-first;
    const changeDisplay = Math.round(Math.abs(kgToDisplay(change, weightUnit))*10)/10;
    const changeSign = change>0 ? '+' : (change<0 ? '−' : '');
    weightChartHtml = `
    <div class="glass chart-card">
      <svg viewBox="0 0 ${wChartW} ${wChartH}" width="100%" height="${wChartH}">
        <polyline points="${pathPoints}" fill="none" stroke="var(--carbs)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
      <div class="chart-legend">${tr('weight_trend')}</div>
    </div>
    <div class="stat-grid">
      ${statTile(ICONS.scale,'var(--carbs)', Math.round(kgToDisplay(last,weightUnit)*10)/10+' '+weightUnit, tr('weight_current'))}
      ${statTile(null,change<=0?'var(--success)':'var(--danger)', changeSign+changeDisplay+' '+weightUnit, tr('weight_change'), true)}
    </div>
    `;
  } else if(weights.length>0){
    weightChartHtml = `<div class="glass form-card"><div class="items-note" style="margin-bottom:0;">${tr('weight_need_more')}</div></div>`;
  }

  return `
  <div class="glass chart-card">
    <svg viewBox="0 0 ${svgW} ${chartH+26}" width="100%" height="${chartH+26}">
      <defs>
        <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--cal-b)"/>
          <stop offset="100%" stop-color="var(--cal-a)"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="${goalY}" x2="${svgW}" y2="${goalY}" stroke="rgba(255,255,255,0.25)" stroke-width="1.3" stroke-dasharray="4,4"/>
      ${bars}
    </svg>
    <div class="chart-legend">- - - ${tr('daily_goal_legend')} · ${goals.calories} kcal</div>
  </div>

  <div class="stat-grid">
    ${statTile(ICONS.flame,'var(--cal-b)', avgCal+' kcal',tr('avg_day'))}
    ${statTile(ICONS.calendarCheck,'var(--success)', daysMet+'/7',tr('goal_days_met'))}
    ${statTile(null,'var(--protein)', avgProtein+'g',tr('avg_protein'), true)}
    ${statTile(null,'var(--carbs)', avgCarbs+'g',tr('avg_carbs'), true)}
    ${statTile(null,'var(--fat)', avgFat+'g',tr('avg_fat'), true)}
    ${statTile(ICONS.meal,'var(--text-dim)', weekEntries.length,tr('meals_logged'))}
  </div>

  ${weightChartHtml}
  `;
}
function statTile(icon, color, num, label, dotOnly){
  const iconHtml = dotOnly
    ? `<div class="stat-icon" style="background:rgba(255,255,255,0.04);"><span style="width:9px;height:9px;border-radius:50%;background:${color};display:block;"></span></div>`
    : `<div class="stat-icon" style="background:rgba(255,255,255,0.05); color:${color};">${icon}</div>`;
  return `<div class="glass stat-tile">${iconHtml}<div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`;
}
function animateWeeklyVisuals(){
  document.querySelectorAll('.wbar').forEach(el=>{
    const h = parseFloat(el.dataset.h);
    const chartH = 120;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      el.setAttribute('height', h);
      el.setAttribute('y', chartH-h);
    }); });
  });
}

function attachHandlers(){
  const app = document.getElementById('app');
  app.onclick = async (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action==='switch-tab'){ currentTab = el.dataset.tab; render(); }
    else if(action==='date-prev'){ currentDate = shiftDate(currentDate,-1); render(); }
    else if(action==='date-next'){ currentDate = shiftDate(currentDate,1); render(); }
    else if(action==='fab-add'){ openAddModal('breakfast'); }
    else if(action==='open-add'){ openAddModal(el.dataset.meal); }
    else if(action==='edit-entry'){ openEditModal(el.dataset.id); }
    else if(action==='delete-entry'){ e.stopPropagation(); await deleteEntry(el.dataset.id); }
    else if(action==='close-sheet'){ closeSheet(); }
    else if(action==='overlay-close'){ if(e.target===el) closeSheet(); }
    else if(action==='trigger-file'){ sheetMode = el.dataset.mode || 'meal'; document.getElementById('photoInput').click(); }
    else if(action==='go-manual'){ sheetMode='meal'; sheetStep='manual'; sheetResult = sheetResult || {name:'',portion:'',calories:0,protein:0,carbs:0,fat:0}; render(); }
    else if(action==='open-recipes'){ sheetStep='recipes'; render(); }
    else if(action==='back-to-capture'){ sheetStep='capture'; render(); }
    else if(action==='pick-recipe'){ pickRecipe(el.dataset.id); }
    else if(action==='delete-recipe'){ e.stopPropagation(); await deleteRecipe(el.dataset.id); }
    else if(action==='retry-analyze'){ analyzePhoto(); }
    else if(action==='pick-meal'){ sheetMeal = el.dataset.meal; render(); }
    else if(action==='confirm-add'){ await confirmAdd(); }
    else if(action==='save-goals'){ await saveGoalsFromForm(); }
    else if(action==='auto-macros'){ autoMacros(); }
    else if(action==='calc-calories'){ caloriesFromMacros(); }
    else if(action==='clear-data'){ await clearAllData(); }
    else if(action==='save-key'){ await saveApiKey(); }
    else if(action==='set-lang'){ await setLanguage(el.dataset.lang); }
    else if(action==='open-weight'){ openWeightSheet(); }
    else if(action==='ws-close'){ wsOpen=false; render(); }
    else if(action==='ws-overlay-close'){ if(e.target===el){ wsOpen=false; render(); } }
    else if(action==='ws-set-unit'){
      syncWsValue();
      const newUnit = el.dataset.unit;
      if(wsValue !== '' && !isNaN(Number(wsValue)) && newUnit !== wsUnit){
        const kg = displayToKg(Number(wsValue), wsUnit);
        wsValue = String(Math.round(kgToDisplay(kg, newUnit)*10)/10);
      }
      wsUnit = newUnit;
      render();
    }
    else if(action==='ws-save'){ await saveWeight(); }
    else if(action==='ws-delete'){ await deleteWeightEntry(); }
    else if(action==='copy-yesterday'){ await copyYesterdayMeals(); }
    else if(action==='export-backup'){ exportBackup(); }
    else if(action==='trigger-import'){ document.getElementById('backupFileInput').click(); }
    else if(action==='remove-key'){ await removeApiKey(); }
    else if(action==='save-gemini-key'){ await saveGeminiKey(); }
    else if(action==='remove-gemini-key'){ await removeGeminiKey(); }
    else if(action==='step'){ stepValue(el.dataset.target, Number(el.dataset.dir)); }
    else if(action==='open-recipe-builder'){ openRecipeBuilder(); }
    else if(action==='goto-recipe-builder'){ sheetOpen=false; openRecipeBuilder(); }
    else if(action==='edit-recipe'){ openRecipeBuilder(el.dataset.id); }
    else if(action==='rb-add-ingredient'){ syncRbFromDOM(); rbIngredients.push({id:uid(), name:'', amount:'', unit:'g'}); render(); }
    else if(action==='rb-remove-ingredient'){ syncRbFromDOM(); rbIngredients = rbIngredients.filter(i=>i.id!==el.dataset.id); render(); }
    else if(action==='rb-calculate'){ await calculateRecipeNutrition(); }
    else if(action==='rb-back-to-edit'){ rbStep='edit'; render(); }
    else if(action==='rb-save'){ await saveRecipeFromBuilder(); }
    else if(action==='rb-delete'){ await deleteRecipeFromBuilder(); }
    else if(action==='rb-close'){ rbOpen=false; render(); }
    else if(action==='rb-overlay-close'){ if(e.target===el){ rbOpen=false; render(); } }
  };

  const slider = document.getElementById('goal-calories');
  if(slider){
    slider.addEventListener('input', ()=>{
      document.getElementById('calSliderNum').textContent = slider.value;
    });
  }
  ['goal-protein','goal-carbs','goal-fat'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.addEventListener('input', ()=>{ if(Number(el.value)<0) el.value = 0; }); }
  });
  const servingsInput = document.getElementById('res-servings');
  if(servingsInput && sheetResult && sheetResult.perServingCalories !== undefined){
    servingsInput.addEventListener('input', ()=>{
      const servings = Math.max(0, Number(servingsInput.value)||0);
      document.getElementById('res-calories').value = Math.round(sheetResult.perServingCalories * servings);
      document.getElementById('res-protein').value = Math.round(sheetResult.perServingProtein * servings);
      document.getElementById('res-carbs').value = Math.round(sheetResult.perServingCarbs * servings);
      document.getElementById('res-fat').value = Math.round(sheetResult.perServingFat * servings);
    });
  }
  ['rb-tot-calories','rb-tot-protein','rb-tot-carbs','rb-tot-fat','rb-yield-2'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      el.addEventListener('input', ()=>{
        const y = Math.max(1, Number(document.getElementById('rb-yield-2').value)||1);
        const cal = Number(document.getElementById('rb-tot-calories').value)||0;
        const pro = Number(document.getElementById('rb-tot-protein').value)||0;
        const car = Number(document.getElementById('rb-tot-carbs').value)||0;
        const fat = Number(document.getElementById('rb-tot-fat').value)||0;
        const preview = document.getElementById('rb-per-serving-preview');
        if(preview){
          preview.innerHTML = `Per serving: <strong>${Math.round(cal/y)} kcal</strong> · P ${Math.round(pro/y)}g · C ${Math.round(car/y)}g · F ${Math.round(fat/y)}g`;
        }
      });
    }
  });
}

function stepValue(id, dir){
  const el = document.getElementById(id);
  if(!el) return;
  const step = 5;
  let v = Number(el.value)||0;
  v = Math.max(0, v + dir*step);
  el.value = v;
}

document.getElementById('backupFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('invalid backup file');

    if(!confirm(tr('restore_confirm'))){ e.target.value=''; return; }

    goals = data.goals || goals;
    entries = Array.isArray(data.entries) ? data.entries : entries;
    recipes = Array.isArray(data.recipes) ? data.recipes : recipes;
    weights = Array.isArray(data.weights) ? data.weights : weights;
    weightUnit = (data.weightUnit==='lb'||data.weightUnit==='kg') ? data.weightUnit : weightUnit;
    apiKey = typeof data.apiKey === 'string' ? data.apiKey : apiKey;
    geminiApiKey = typeof data.geminiApiKey === 'string' ? data.geminiApiKey : geminiApiKey;
    appLang = (data.appLang==='th'||data.appLang==='en') ? data.appLang : appLang;
    MEAL_LABELS = appLang==='th' ? MEAL_LABELS_TH : MEAL_LABELS_EN;

    await saveGoalsToStorage(goals);
    await saveEntriesToStorage(entries);
    await saveRecipesToStorage(recipes);
    await saveWeightsToStorage(weights);
    await saveWeightUnitToStorage(weightUnit);
    await saveApiKeyToStorage(apiKey);
    await saveGeminiKeyToStorage(geminiApiKey);
    await saveLangToStorage(appLang);

    render();
    showToast(tr('backup_restored'));
  }catch(err){
    console.error('restore failed', err);
    showToast(tr('backup_bad_file'));
  }
  e.target.value = '';
});

function exportBackup(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    goals, entries, recipes, weights, weightUnit,
    apiKey, geminiApiKey, appLang
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calorie-snap-backup-${localDateStr(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast(tr('backup_downloaded'));
}

const NUTRITION_PROMPT = `You are a careful nutrition estimation assistant analyzing a photo of a meal.

Steps:
1. Look closely and identify EVERY distinct food/dish visible on the plate or in the photo. Consider that this may be Thai, other Southeast Asian, or any world cuisine — name dishes specifically when recognizable (e.g. "pad kra pao moo" rather than just "stir-fried meat with rice") rather than defaulting to generic Western food guesses.
2. If you are not fully certain of a specific dish name, describe it by its visible ingredients and cooking method instead of guessing a specific dish name incorrectly (e.g. "stir-fried minced pork with basil and chili" is better than a wrong specific dish name).
3. Note visible components separately in "items" (e.g. rice, main dish, fried egg, side vegetables) rather than lumping everything into one vague label.
4. Estimate total calories and macros for the ENTIRE meal shown (sum of all visible items), using realistic typical portion sizes for what's visible.

Respond with ONLY valid JSON, no markdown fences, no commentary, in exactly this shape:
{"items":[{"name":"string","portion":"string"}],"calories":number,"protein_g":number,"carbs_g":number,"fat_g":number,"confidence":"low|medium|high","note":"short string, 12 words max, flag anything uncertain"}`;

const NUTRITION_LABEL_PROMPT = `You are reading a printed Nutrition Facts label from a photo (packaged food).

Read the EXACT printed numbers for a single serving — do not estimate or round beyond what's printed. If the product name is visible on the packaging, include it; otherwise leave it empty.

Respond with ONLY valid JSON, no markdown fences, no commentary, in exactly this shape:
{"productName":"string, empty if not visible","servingSize":"string, e.g. '2/3 cup (55g)'","caloriesPerServing":number,"proteinPerServing":number,"carbsPerServing":number,"fatPerServing":number,"note":"short string, 12 words max, flag anything hard to read"}`;

async function callGemini(prompt){
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": geminiApiKey
    },
    body: JSON.stringify({
      contents: [{
        parts: [
          { inline_data: { mime_type: "image/jpeg", data: sheetImageBase64 } },
          { text: prompt }
        ]
      }],
      generationConfig: { response_mime_type: "application/json" }
    })
  });
  if(!response.ok){
    let apiMsg = '';
    try{ const errBody = await response.json(); apiMsg = errBody?.error?.message || ''; }catch(e){}
    if(response.status===400 || response.status===403){
      throw new Error(`Gemini key rejected${apiMsg ? ': '+apiMsg : '. Double-check it in the Goals tab.'}`);
    }
    if(response.status===429){
      throw new Error("Gemini free tier rate limit hit. Try again in a moment, or enter manually.");
    }
    if(response.status===404){
      throw new Error(`Gemini model unavailable${apiMsg ? ': '+apiMsg : ' (may have been renamed/retired).'}`);
    }
    throw new Error(`Gemini request failed (${response.status})${apiMsg ? ': '+apiMsg : ''}`);
  }
  const data = await response.json();
  if(data?.promptFeedback?.blockReason){
    throw new Error(`Photo was blocked by Gemini's safety filter (${data.promptFeedback.blockReason}). Try a different photo or enter manually.`);
  }
  const candidate = data?.candidates?.[0];
  if(candidate?.finishReason && candidate.finishReason !== 'STOP'){
    throw new Error(`Gemini couldn't finish (${candidate.finishReason}). Try again or enter manually.`);
  }
  const text = candidate?.content?.parts?.[0]?.text;
  if(!text) throw new Error('Empty response from Gemini. Try again or enter manually.');
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{
    return JSON.parse(clean);
  }catch(e){
    throw new Error('Gemini returned an unreadable response. Try again or enter manually.');
  }
}

async function callAnthropic(prompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: sheetImageBase64 } },
          { type: "text", text: prompt }
        ]
      }]
    })
  });
  if(!response.ok){
    if(response.status===401){
      throw new Error("Anthropic API key was rejected. Double-check it in the Goals tab.");
    }
    throw new Error(`Analysis request failed (${response.status}).`);
  }
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No response from analysis.');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(clean);
}

async function analyzePhoto(){
  if(!geminiApiKey && !apiKey){
    sheetError = "No API key set. Go to the Goals tab and add a free Google Gemini key (recommended) to enable photo analysis.";
    sheetStep = 'error';
    render();
    return;
  }
  sheetStep = 'analyzing';
  render();
  try{
    const langSuffix = appLang === 'th' ? '\n\nRespond with all food/product names and any text values in Thai language (ภาษาไทย). Keep JSON keys in English exactly as specified.' : '';
    const prompt = (sheetMode === 'label' ? NUTRITION_LABEL_PROMPT : NUTRITION_PROMPT) + langSuffix;
    const parsed = geminiApiKey ? await callGemini(prompt) : await callAnthropic(prompt);

    if(sheetMode === 'label'){
      const perCal = Number(parsed.caloriesPerServing)||0;
      const perProtein = Number(parsed.proteinPerServing)||0;
      const perCarbs = Number(parsed.carbsPerServing)||0;
      const perFat = Number(parsed.fatPerServing)||0;
      sheetResult = {
        name: parsed.productName || 'Packaged food',
        portion: parsed.servingSize || '',
        servingsConsumed: 1,
        perServingCalories: perCal,
        perServingProtein: perProtein,
        perServingCarbs: perCarbs,
        perServingFat: perFat,
        calories: perCal,
        protein: perProtein,
        carbs: perCarbs,
        fat: perFat,
        itemsText: parsed.servingSize ? `Per serving: ${parsed.servingSize}` : '',
        note: parsed.note || ''
      };
    } else {
      const itemsText = (parsed.items||[]).map(it=>it.portion? `${it.name} (${it.portion})` : it.name).join(', ');
      sheetResult = {
        name: (parsed.items && parsed.items.length) ? parsed.items.map(it=>it.name).join(', ') : 'Meal',
        portion: (parsed.items && parsed.items.length===1) ? (parsed.items[0].portion||'') : '',
        calories: Number(parsed.calories)||0,
        protein: Number(parsed.protein_g)||0,
        carbs: Number(parsed.carbs_g)||0,
        fat: Number(parsed.fat_g)||0,
        itemsText: itemsText,
        note: parsed.note || ''
      };
    }
    sheetStep = 'result';
    render();
  }catch(err){
    console.error('analysis failed', err);
    sheetError = (err && err.name === 'TypeError')
      ? "Couldn't reach the analysis service (network or connection issue). Check your connection and try again, or enter manually."
      : ((err && err.message) ? err.message : "Couldn't estimate this photo. You can try again or enter the meal manually.");
    sheetStep = 'error';
    render();
  }
}

async function confirmAdd(){

  const data = await response.json();
  const candidate = data?.candidates?.[0];
  const text = candidate?.content?.parts?.[0]?.text;
  if(!text) throw new Error('Empty response from Gemini. Try again.');
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(clean); }
  catch(e){ throw new Error('Gemini returned an unreadable response. Try again.'); }
}

async function callAnthropicTextOnly(prompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      messages: [{ role: "user", content: [{ type: "text", text: prompt }] }]
    })
  });
  if(!response.ok){
    if(response.status===401){
      throw new Error("Anthropic API key was rejected. Double-check it in the Goals tab.");
    }
    throw new Error(`Analysis request failed (${response.status}).`);
  }
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No response from analysis.');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(clean);
}

async function calculateRecipeNutrition(){
  syncRbFromDOM();
  const validIngredients = rbIngredients.filter(i=>i.name.trim());
  if(validIngredients.length===0){
    rbError = "Add at least one ingredient with a name.";
    rbStep = 'error';
    render();
    return;
  }
  if(!geminiApiKey && !apiKey){
    rbError = "No API key set. Go to the Goals tab and add a free Google Gemini key to enable recipe calculation.";
    rbStep = 'error';
    render();
    return;
  }
  rbStep = 'calculating';
  render();
  try{
    const ingredientLines = validIngredients.map(i=>{
      const amt = (i.amount || '').trim();
      const unitText = i.unit === 'to taste' ? 'to taste' : (amt ? `${amt} ${i.unit || ''}`.trim() : (i.unit || 'unspecified amount'));
      return `- ${i.name}: ${unitText}`;
    }).join('\n');
    const rbLangSuffix = appLang === 'th' ? '\n\nRespond with the "note" text in Thai language (ภาษาไทย). Keep JSON keys in English exactly as specified.' : '';
    const prompt = RECIPE_CALC_PROMPT_HEADER + ingredientLines + rbLangSuffix;
    const parsed = geminiApiKey ? await callGeminiTextOnly(prompt) : await callAnthropicTextOnly(prompt);
    rbTotals = {
      calories: Number(parsed.calories)||0,
      protein: Number(parsed.protein_g)||0,
      carbs: Number(parsed.carbs_g)||0,
      fat: Number(parsed.fat_g)||0
    };
    rbStep = 'result';
    render();
  }catch(err){
    console.error('recipe calc failed', err);
    rbError = (err && err.name==='TypeError')
      ? "Couldn't reach the analysis service (network issue). Try again."
      : ((err && err.message) ? err.message : "Couldn't calculate this recipe. Try again.");
    rbStep = 'error';
    render();
  }
}

async function saveRecipeFromBuilder(){
  const totCalories = Number(document.getElementById('rb-tot-calories').value)||0;
  const totProtein = Number(document.getElementById('rb-tot-protein').value)||0;
  const totCarbs = Number(document.getElementById('rb-tot-carbs').value)||0;
  const totFat = Number(document.getElementById('rb-tot-fat').value)||0;
  rbYield = Math.max(1, Number(document.getElementById('rb-yield-2').value)||rbYield);

  const validIngredients = rbIngredients.filter(i=>i.name.trim());
  const recipe = {
    id: rbEditingRecipeId || uid(),
    name: rbName.trim() || 'Recipe',
    portion: `1 of ${rbYield} servings`,
    yieldServings: rbYield,
    ingredients: validIngredients.map(i=>({name:i.name.trim(), amount:(i.amount||'').trim(), unit:i.unit||'g'})),
    calories: Math.round(totCalories/rbYield),
    protein: Math.round(totProtein/rbYield),
    carbs: Math.round(totCarbs/rbYield),
    fat: Math.round(totFat/rbYield)
  };

  if(rbEditingRecipeId){
    const idx = recipes.findIndex(r=>r.id===rbEditingRecipeId);
    if(idx>-1) recipes[idx] = recipe; else recipes.push(recipe);
  } else {
    recipes.push(recipe);
  }
  await saveRecipesToStorage(recipes);
  rbOpen = false;
  render();
  showToast(rbEditingRecipeId ? 'Recipe updated' : 'Recipe saved');
}

async function deleteRecipeFromBuilder(){
  if(!rbEditingRecipeId) return;
  if(!confirm('Delete this recipe? This cannot be undone.')) return;
  recipes = recipes.filter(r=>r.id!==rbEditingRecipeId);
  await saveRecipesToStorage(recipes);
  rbOpen = false;
  render();
  showToast('Recipe deleted');
}

async function saveGoalsFromForm(){

function autoMacros(){
  const cal = Number(document.getElementById('goal-calories').value)||2000;
  document.getElementById('goal-protein').value = Math.round((cal*0.30)/4);
  document.getElementById('goal-carbs').value = Math.round((cal*0.40)/4);
  document.getElementById('goal-fat').value = Math.round((cal*0.30)/9);
}

function caloriesFromMacros(){
  const protein = Number(document.getElementById('goal-protein').value)||0;
  const carbs = Number(document.getElementById('goal-carbs').value)||0;
  const fat = Number(document.getElementById('goal-fat').value)||0;
  const cal = Math.round(protein*4 + carbs*4 + fat*9);
  const slider = document.getElementById('goal-calories');
  const clamped = Math.min(4000, Math.max(1000, cal));
  slider.value = clamped;
  document.getElementById('calSliderNum').textContent = clamped;
  if(cal !== clamped){
    showToast(`Calculated ${cal} kcal (capped to slider range)`);
  } else {
    showToast(`Calories set to ${cal} kcal`);
  }
}

// ---------- weight sheet logic ----------
function syncWsValue(){
  const el = document.getElementById('ws-value');
  if(el) wsValue = el.value;
}
function openWeightSheet(){
  wsOpen = true;
  wsUnit = weightUnit;
  const existing = weightForDate(currentDate);
  if(existing){
    wsValue = String(Math.round(kgToDisplay(existing.kg, wsUnit)*10)/10);
  } else {
    const latest = latestWeight();
    wsValue = latest ? String(Math.round(kgToDisplay(latest.kg, wsUnit)*10)/10) : '';
  }
  render();
}
async function saveWeight(){
  syncWsValue();
  const val = Number(wsValue);
  if(!val || val<=0){ showToast('Enter a valid weight'); return; }
  const kg = displayToKg(val, wsUnit);
  await upsertWeight(currentDate, kg);
  weightUnit = wsUnit;
  await saveWeightUnitToStorage(weightUnit);
  wsOpen = false;
  render();
  showToast('Weight saved');
}
async function deleteWeightEntry(){
  await deleteWeightForDate(currentDate);
  wsOpen = false;
  render();
  showToast('Weight entry removed');
}

// ---------- copy yesterday's meals ----------
async function copyYesterdayMeals(){
  const yDate = shiftDate(currentDate,-1);
  const yEntries = entriesForDate(yDate);
  if(yEntries.length===0) return;
  const copies = yEntries.map(e=>({
    ...e,
    id: uid(),
    date: currentDate,
    addedAt: Date.now()
  }));
  entries.push(...copies);
  await saveEntriesToStorage(entries);
  render();
  showToast(`Copied ${copies.length} item${copies.length===1?'':'s'} from yesterday`);
}

init();
