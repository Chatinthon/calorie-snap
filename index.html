<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#0E1015;
  color:#F3F4F7;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
:root{
  --bg:#0E1015;
  --surface:rgba(255,255,255,0.05);
  --surface-strong:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.09);
  --text:#F3F4F7;
  --text-dim:#8A8F99;
  --text-faint:#5B5F69;
  --cal-a:#FF7A59;
  --cal-b:#FFC15E;
  --protein:#A78BFA;
  --carbs:#38BDF8;
  --fat:#FBBF24;
  --success:#34D399;
  --danger:#FB7185;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(600px 300px at 15% -5%, rgba(255,122,89,0.16), transparent 60%),
    radial-gradient(500px 260px at 100% 0%, rgba(56,189,248,0.10), transparent 55%),
    var(--bg);
  padding-bottom:110px;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{display:none;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 20px 6px;
}
.greeting{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:-0.3px;
}
.date-label{
  font-size:12.5px;
  color:var(--text-dim);
  margin-top:2px;
}
.date-switch{display:flex; gap:8px;}
.icon-round{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.icon-round:active{transform:scale(0.9); background:var(--surface-strong);}
.icon-round svg{width:16px;height:16px;}
.icon-round[disabled]{opacity:0.25; pointer-events:none;}

/* ---------- generic ---------- */
.view{padding:8px 18px 4px;}
.hidden{display:none !important;}
.fade-in{animation:fadeUp .38s cubic-bezier(.2,.8,.25,1) both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.glass{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  backdrop-filter:blur(14px);
}

/* ---------- ring card ---------- */
.ring-card{
  padding:22px 20px 20px;
  margin-bottom:16px;
  text-align:center;
}
.ring-wrap{position:relative; width:190px; height:190px; margin:4px auto 6px;}
.ring-wrap svg{width:100%; height:100%;}
.ring-progress{transition:stroke-dashoffset 1s cubic-bezier(.25,.8,.3,1);}
.ring-center{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:38px;
  line-height:1;
  letter-spacing:-1px;
}
.ring-sub{
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:6px;
  font-weight:500;
}
.ring-sub.over{color:var(--danger);}
.ring-sub.met{color:var(--success);}
.pill-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.pill{
  flex:1;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:10px 10px 11px;
  text-align:left;
}
.pill-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10.5px;
  color:var(--text-dim);
  font-weight:600;
  margin-bottom:6px;
}
.pill-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.pill-val{font-size:12.5px; font-weight:700; color:var(--text);}
.pill-track{
  height:5px;
  border-radius:4px;
  background:rgba(255,255,255,0.07);
  overflow:hidden;
}
.pill-fill{height:100%; border-radius:4px; transition:width .9s cubic-bezier(.25,.8,.3,1); width:0%;}

/* ---------- meal groups ---------- */
.meal-group{margin-bottom:14px; padding:14px 14px 6px;}
.meal-group-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  padding:0 2px;
}
.meal-title-row{display:flex; align-items:center; gap:8px;}
.meal-emoji{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
}
.meal-title{font-size:14.5px; font-weight:700;}
.meal-cal{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.meal-add{
  width:30px;height:30px;
  border-radius:50%;
  background:var(--surface-strong);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.meal-add svg{width:14px;height:14px;}
.meal-add:active{transform:scale(0.88);}

.entry-row{
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 2px;
  border-top:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.meal-group .entry-row:first-of-type{border-top:none;}
.entry-thumb{
  width:42px;height:42px;border-radius:12px;
  object-fit:cover;
  flex-shrink:0;
  background:var(--surface-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
}
.entry-main{flex:1; min-width:0;}
.entry-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.entry-portion{font-size:11px; color:var(--text-dim); margin-top:1px;}
.entry-cal{font-size:13px; font-weight:700; white-space:nowrap;}
.entry-del{
  width:26px;height:26px;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.entry-del svg{width:13px;height:13px;}
.entry-del:active{color:var(--danger);}
.meal-empty{
  padding:10px 2px 12px;
  font-size:12px;
  color:var(--text-faint);
}

/* ---------- weekly ---------- */
.section-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:-0.3px;
  margin:10px 2px 2px;
}
.section-sub{font-size:12px; color:var(--text-dim); margin:0 2px 14px;}
.chart-card{padding:18px 14px 10px; margin-bottom:14px;}
.chart-legend{font-size:10.5px; color:var(--text-dim); text-align:center; margin-top:8px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.stat-tile{padding:14px;}
.stat-icon{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;
}
.stat-icon svg{width:15px;height:15px;}
.stat-num{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px;}
.stat-label{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

/* ---------- goals ---------- */
.form-card{padding:20px; margin-bottom:14px;}
.form-card h3{font-size:14px; font-weight:700; margin:0 0 4px;}
.form-card .form-sub{font-size:11.5px; color:var(--text-dim); margin-bottom:16px;}
.slider-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:34px;
  text-align:center;
  margin-bottom:10px;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
input[type=range]{
  width:100%;
  -webkit-appearance:none;
  height:6px;
  border-radius:4px;
  background:rgba(255,255,255,0.08);
  margin-bottom:4px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;height:22px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  border:3px solid #0E1015;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,0.15);
}
.range-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--text-faint); margin-bottom:18px;}
.stepper-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 4px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.form-card .stepper-row:first-of-type{border-top:none;}
.stepper-label{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;}
.stepper-controls{display:flex; align-items:center; gap:10px;}
.stepper-btn{
  width:28px;height:28px;
  border-radius:50%;
  background:var(--surface-strong);
  border:1px solid var(--border);
  color:var(--text);
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.stepper-btn:active{transform:scale(0.88);}
.stepper-val{
  font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14px;
  width:52px; text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:6px 2px;
  -moz-appearance:textfield;
}
.stepper-val::-webkit-outer-spin-button, .stepper-val::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0;
}
.stepper-val:focus{outline:none; border-color:var(--cal-b);}
.btn-primary{
  width:100%;
  padding:14px;
  border:none;
  border-radius:var(--r-md);
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  color:#1A1206;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:14px;
  letter-spacing:0.2px;
  cursor:pointer;
  margin-top:8px;
}
.btn-primary:active{transform:scale(0.98);}
.btn-ghost{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:var(--r-md);
  background:transparent;
  color:var(--text-dim);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.link-danger{
  display:block;
  text-align:center;
  font-size:12.5px;
  color:var(--danger);
  margin-top:14px;
  cursor:pointer;
  opacity:0.85;
}

/* ---------- bottom nav + fab ---------- */
.bottom-nav{
  position:fixed;
  bottom:0; left:0; right:0;
  max-width:480px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:rgba(18,20,26,0.85);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  z-index:30;
}
.nav-btn{
  background:none; border:none; color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:600;
  padding:4px 14px;
  cursor:pointer;
}
.nav-btn svg{width:20px;height:20px;}
.nav-btn.active{color:var(--text);}
.nav-btn.active svg{color:var(--cal-b);}
.fab{
  position:fixed;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  width:56px;height:56px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg, var(--cal-a), var(--cal-b));
  color:#1A1206;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(255,122,89,0.35);
  cursor:pointer;
  z-index:31;
  transition:transform .15s ease;
}
.fab:active{transform:translateX(-50%) scale(0.92);}
.fab svg{width:24px;height:24px;}

/* ---------- bottom sheet modal ---------- */
.sheet-overlay{
  position:fixed; inset:0;
  background:rgba(6,7,10,0.6);
  backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:60;
  animation:overlayIn .25s ease both;
}
@keyframes overlayIn{from{opacity:0;} to{opacity:1;}}
.sheet{
  width:100%; max-width:480px;
  max-height:90vh;
  overflow-y:auto;
  background:#15171E;
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  animation:sheetUp .35s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{
  width:38px; height:4px; border-radius:3px;
  background:rgba(255,255,255,0.18);
  margin:6px auto 14px;
}
.sheet-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800; font-size:17px;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.sheet-close{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface-strong); border:none; color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.sheet-close svg{width:14px;height:14px;}

.capture-box{
  border:1.5px dashed rgba(255,255,255,0.18);
  border-radius:var(--r-lg);
  padding:36px 16px;
  text-align:center;
  cursor:pointer;
  background:rgba(255,255,255,0.02);
}
.capture-box:active{background:rgba(255,255,255,0.05);}
.capture-icon{
  width:52px;height:52px;border-radius:50%;
  margin:0 auto 12px;
  background:linear-gradient(135deg, rgba(255,122,89,0.25), rgba(255,193,94,0.15));
  display:flex;align-items:center;justify-content:center;
}
.capture-icon svg{width:22px;height:22px; color:var(--cal-b);}
.capture-text{font-size:13.5px; font-weight:700;}
.capture-hint{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.manual-link{
  display:block; text-align:center; margin-top:14px;
  font-size:12.5px; color:var(--text-dim); text-decoration:underline; cursor:pointer;
}

.preview-img{
  width:100%; max-height:200px; object-fit:cover;
  border-radius:var(--r-md); margin-bottom:14px;
}
.skeleton-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.skeleton-block{
  border-radius:8px;
  background:linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 37%, rgba(255,255,255,0.05) 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}
.loading-label{
  text-align:center; font-size:12.5px; color:var(--text-dim);

}
.error-box{
  background:rgba(251,113,133,0.12);
  border:1px solid rgba(251,113,133,0.3);

}

.meal-select{display:flex; gap:7px; margin-bottom:16px;}
.meal-chip{
  flex:1;
  text-align:center;
  padding:9px 4px;
  border-radius:12px;

}
.meal-chip.active{

}
.field{margin-bottom:12px;}
.field label{

}
.field input{
  width:100%;
  padding:11px 12px;
  border-radius:var(--r-sm);
  border:1px solid var(--border);

  font-size:14px;
}
.field input:focus{outline:none; border-color:var(--cal-b);}
.macro-input-row{display:flex; gap:10px;}
.macro-input-row .field{flex:1;}
.items-note{
  font-size:12px; color:var(--text-dim);
  background:rgba(255,255,255,0.03);
  border-radius:var(--r-sm);

}

.toast{
  position:fixed;
  bottom:96px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(25,27,34,0.95);
  border:1px solid var(--border);

  padding:11px 18px;

  font-size:12.5px;

@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
.toast.out{animation:toastOut .25s ease forwards;}
@keyframes toastOut{to{opacity:0; transform:translateX(-50%) translateY(10px);}}

.loading-screen{
  padding:70px 20px; text-align:center;
  color:var(--text-dim); font-size:13px; font-weight:600;
}

@media (prefers-reduced-motion: reduce){
  .fade-in, .sheet, .sheet-overlay, .toast{animation:none !important;}
  .ring-progress, .pill-fill{transition:none !important;}
  .skeleton-block{animation:none !important;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-screen">Loading your log…</div>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none;">

<script>
(function(){

const DEFAULT_GOALS = { calories: 2000, protein: 100, carbs: 250, fat: 65 };
const MEAL_TYPES = ['breakfast','lunch','dinner','snack'];
const MEAL_LABELS = { breakfast:'Breakfast', lunch:'Lunch', dinner:'Dinner', snack:'Snack' };
const MEAL_EMOJI = { breakfast:'🍳', lunch:'🥗', dinner:'🍽️', snack:'🍪' };
const MEAL_BG = {
  breakfast:'linear-gradient(135deg, rgba(255,122,89,0.25), rgba(255,193,94,0.15))',
  lunch:'linear-gradient(135deg, rgba(56,189,248,0.25), rgba(56,189,248,0.08))',
  dinner:'linear-gradient(135deg, rgba(167,139,250,0.25), rgba(167,139,250,0.08))',
  snack:'linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.08))'
};

const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-6"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chevLeft:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  chevRight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 5 5 10a5 5 0 01-10 0c0-1.5 1-3 1-3s.5 2 2 2c-1-3 1-5 1-6z"/></svg>',
  calendarCheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M9 15l2 2 4-4"/></svg>',
  meal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9M8 3v4a2 2 0 002 2M16 3v18M8 12v9"/></svg>'
};

let goals = { ...DEFAULT_GOALS };
let entries = [];
let apiKey = '';
let geminiApiKey = '';
let currentTab = 'today';
let currentDate = localDateStr(new Date());
const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// modal / sheet state
let sheetOpen = false;
let sheetStep = 'capture';
let sheetMeal = 'breakfast';
let sheetImageBase64 = null;
let sheetImageMime = null;
let sheetThumb = null;
let sheetResult = null;
let sheetError = '';
let editingEntryId = null;

function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function shiftDate(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return localDateStr(d);
}
function friendlyDate(dateStr){
  const today = localDateStr(new Date());
  const yesterday = shiftDate(today,-1);
  if(dateStr===today) return 'Today';
  if(dateStr===yesterday) return 'Yesterday';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
}
function shortDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function dayAbbr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
}
function greetingForNow(){
  const h = new Date().getHours();
  if(h<5) return 'Still up?';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Good night';
}

// ---------- storage ----------
// Uses Claude's window.storage when running inside a Claude artifact view.
// Falls back to the browser's own localStorage when opened as a standalone
// page (e.g. added to the home screen and launched directly via Chrome),
// since window.storage only exists inside Claude's sandbox.
const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ const r = await window.storage.get(key); return (r && r.value) ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem('calorieSnap:'+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, value); }catch(e){ console.error('save failed', e); }
    return;
  }
  try{ localStorage.setItem('calorieSnap:'+key, value); }catch(e){ console.error('save failed', e); }
}

async function loadGoals(){
  const v = await storageGet('goals');
  if(v){ try{ return JSON.parse(v); }catch(e){} }
  return { ...DEFAULT_GOALS };
}
async function saveGoalsToStorage(g){
  await storageSet('goals', JSON.stringify(g));
}
async function loadEntries(){
  const v = await storageGet('entries');
  if(v){ try{ return JSON.parse(v); }catch(e){} }
  return [];
}
async function saveEntriesToStorage(list){
  await storageSet('entries', JSON.stringify(list));
}
async function loadApiKey(){
  const v = await storageGet('apiKey');
  return v || '';
}
async function saveApiKeyToStorage(key){
  await storageSet('apiKey', key);
}
async function loadGeminiKey(){
  const v = await storageGet('geminiApiKey');
  return v || '';
}
async function saveGeminiKeyToStorage(key){
  await storageSet('geminiApiKey', key);
}

function entriesForDate(dateStr){ return entries.filter(e=>e.date===dateStr); }
function totalsFor(list){
  return list.reduce((acc,e)=>{
    acc.calories += Number(e.calories)||0;
    acc.protein += Number(e.protein)||0;
    acc.carbs += Number(e.carbs)||0;
    acc.fat += Number(e.fat)||0;
    return acc;
  },{calories:0,protein:0,carbs:0,fat:0});
}
function last7Dates(endDateStr){
  const arr=[]; for(let i=6;i>=0;i--) arr.push(shiftDate(endDateStr,-i)); return arr;
}
function uid(){ return 'e'+Date.now()+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- image resize ----------
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- count-up animation ----------
function animateNumber(el, target, duration){
  if(REDUCE_MOTION || !el){ if(el) el.textContent = Math.round(target); return; }
  const start = 0;
  const startTime = performance.now();
  function tick(now){
    const p = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(start + (target-start)*eased);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ================= RENDER =================
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    <main class="view fade-in" id="view">
      ${currentTab==='today' ? renderToday() : ''}
      ${currentTab==='weekly' ? renderWeekly() : ''}
      ${currentTab==='goals' ? renderGoals() : ''}
    </main>
    ${renderBottomNav()}
    <button class="fab" data-action="fab-add">${ICONS.plus}</button>
    ${sheetOpen ? renderSheet() : ''}
  `;
  attachHandlers();
  if(currentTab==='today') animateTodayVisuals();
  if(currentTab==='weekly') animateWeeklyVisuals();
}

function renderTopbar(){
  const isToday = currentDate === localDateStr(new Date());
  return `
  <header class="topbar">
    <div>
      <div class="greeting">${currentTab==='today' ? greetingForNow() : (currentTab==='weekly' ? 'Your week' : 'Your goals')}</div>
      <div class="date-label">${currentTab==='today' ? shortDate(currentDate) : (currentTab==='weekly' ? 'Last 7 days' : 'Daily targets')}</div>
    </div>
    ${currentTab==='today' ? `
    <div class="date-switch">
      <button class="icon-round" data-action="date-prev">${ICONS.chevLeft}</button>
      <button class="icon-round" data-action="date-next" ${isToday?'disabled':''}>${ICONS.chevRight}</button>
    </div>` : ''}
  </header>`;
}

function renderBottomNav(){
  const tabs = [['today','Today',ICONS.home],['weekly','Weekly',ICONS.chart],['goals','Goals',ICONS.target]];
  return `<nav class="bottom-nav">
    ${tabs.slice(0,2).map(t=>navBtn(t)).join('')}
    <div style="width:56px;"></div>
    ${navBtn(tabs[2])}
    <div style="width:64px; flex-shrink:0;"></div>
  </nav>`;
}
function navBtn([id,label,icon]){
  return `<button class="nav-btn ${currentTab===id?'active':''}" data-action="switch-tab" data-tab="${id}">${icon}<span>${label}</span></button>`;
}

// ---------- TODAY ----------
function renderToday(){
  const dayEntries = entriesForDate(currentDate);
  const t = totalsFor(dayEntries);
  const remaining = goals.calories - t.calories;
  const over = remaining < 0;
  const met = t.calories>0 && !over;
  const pct = goals.calories>0 ? Math.min(1, t.calories/goals.calories) : 0;

  const R = 70, CIRC = 2*Math.PI*R;
  const offset = CIRC * (1-pct);
  const ringColor = over ? 'var(--danger)' : 'url(#calGrad)';

  const macroPill = (label, key, color, val, target)=>{
    const pct2 = target>0 ? Math.min(100, Math.round((val/target)*100)) : 0;
    return `
    <div class="pill">
      <div class="pill-top"><span><span class="pill-dot" style="background:${color}"></span>${label}</span></div>
      <div class="pill-val">${Math.round(val)}<span style="color:var(--text-dim); font-weight:500;">/${target}g</span></div>
      <div class="pill-track" style="margin-top:6px;"><div class="pill-fill" data-w="${pct2}" style="background:${color}"></div></div>
    </div>`;
  };

  return `
  <div class="glass ring-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 160 160">
        <defs>
          <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--cal-a)"/>
            <stop offset="100%" stop-color="var(--cal-b)"/>
          </linearGradient>
        </defs>
        <circle cx="80" cy="80" r="${R}" stroke="rgba(255,255,255,0.07)" stroke-width="14" fill="none"/>
        <circle class="ring-progress" id="ringProgress" cx="80" cy="80" r="${R}" stroke="${ringColor}" stroke-width="14" fill="none"
          stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"
          data-offset="${offset}" transform="rotate(-90 80 80)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-num" id="ringNum">0</div>
        <div class="ring-sub ${over?'over':(met?'met':'')}">
          ${over ? `${Math.abs(Math.round(remaining))} kcal over` : `${Math.round(remaining)} kcal left`}
        </div>
      </div>
    </div>
    <div class="pill-row">
      ${macroPill('Protein','protein','var(--protein)', t.protein, goals.protein)}
      ${macroPill('Carbs','carbs','var(--carbs)', t.carbs, goals.carbs)}
      ${macroPill('Fat','fat','var(--fat)', t.fat, goals.fat)}
    </div>
  </div>

  ${MEAL_TYPES.map(m=>renderMealGroup(m, dayEntries.filter(e=>e.meal===m))).join('')}
  `;
}

function renderMealGroup(meal, items){
  const t = totalsFor(items);
  return `
  <div class="glass meal-group">
    <div class="meal-group-head">
      <div class="meal-title-row">
        <div class="meal-emoji" style="background:${MEAL_BG[meal]}">${MEAL_EMOJI[meal]}</div>
        <div>
          <div class="meal-title">${MEAL_LABELS[meal]}</div>
          <div class="meal-cal">${Math.round(t.calories)} kcal</div>
        </div>
      </div>
      <button class="meal-add" data-action="open-add" data-meal="${meal}">${ICONS.plus}</button>
    </div>
    ${items.length===0
      ? `<div class="meal-empty">Nothing logged yet — tap + to snap a photo.</div>`
      : items.map(e=>`
        <div class="entry-row" data-action="edit-entry" data-id="${e.id}">
          ${e.thumb
            ? `<img class="entry-thumb" src="data:${e.thumbMime||'image/jpeg'};base64,${e.thumb}">`
            : `<div class="entry-thumb" style="background:${MEAL_BG[meal]}">${MEAL_EMOJI[meal]}</div>`}
          <div class="entry-main">
            <div class="entry-name">${escapeHtml(e.name)}</div>
            <div class="entry-portion">${escapeHtml(e.portion||'')}</div>
          </div>
          <div class="entry-cal">${Math.round(e.calories)}</div>

// ---------- WEEKLY ----------
function renderWeekly(){
  const dates = last7Dates(currentDate);
  const dayTotals = dates.map(d=>totalsFor(entriesForDate(d)));
  const maxCal = Math.max(goals.calories, ...dayTotals.map(t=>t.calories), 1);
  const chartH = 120, barW = 24, gap = 12;
  const svgW = dates.length*(barW+gap)+gap;
  const goalY = chartH - Math.min(chartH, (goals.calories/maxCal)*chartH);

  const bars = dates.map((d,i)=>{
    const cal = dayTotals[i].calories;
    const h = Math.max(3, (cal/maxCal)*chartH);
    const x = gap + i*(barW+gap);
    const isToday = d===localDateStr(new Date());
    const over = cal>goals.calories;
    const fill = over ? 'var(--danger)' : 'url(#barGrad)';
    return `<rect class="wbar" data-h="${h}" x="${x}" y="${chartH}" width="${barW}" height="0" rx="7" fill="${fill}"></rect>
    <text x="${x+barW/2}" y="${chartH+18}" text-anchor="middle" font-size="9.5" font-weight="${isToday?'800':'500'}" fill="${isToday?'#F3F4F7':'#5B5F69'}" font-family="Inter, sans-serif">${dayAbbr(d)}</text>`;
  }).join('');

  const weekEntries = entries.filter(e=>dates.includes(e.date));
  const avg = totalsFor(weekEntries);
  const avgCal = Math.round(avg.calories/7);
  const avgProtein = Math.round(avg.protein/7);
  const avgCarbs = Math.round(avg.carbs/7);
  const avgFat = Math.round(avg.fat/7);
  const daysMet = dayTotals.filter(t=>t.calories>0 && t.calories<=goals.calories).length;

  return `
  <div class="glass chart-card">
    <svg viewBox="0 0 ${svgW} ${chartH+26}" width="100%" height="${chartH+26}">
      <defs>
        <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--cal-b)"/>
          <stop offset="100%" stop-color="var(--cal-a)"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="${goalY}" x2="${svgW}" y2="${goalY}" stroke="rgba(255,255,255,0.25)" stroke-width="1.3" stroke-dasharray="4,4"/>
      ${bars}
    </svg>
    <div class="chart-legend">- - - daily goal · ${goals.calories} kcal</div>
  </div>

  <div class="stat-grid">
    ${statTile(ICONS.flame,'var(--cal-b)', avgCal+' kcal','Avg / day')}
    ${statTile(ICONS.calendarCheck,'var(--success)', daysMet+'/7','Goal days met')}
    ${statTile(null,'var(--protein)', avgProtein+'g','Avg protein', true)}
    ${statTile(null,'var(--carbs)', avgCarbs+'g','Avg carbs', true)}
    ${statTile(null,'var(--fat)', avgFat+'g','Avg fat', true)}
    ${statTile(ICONS.meal,'var(--text-dim)', weekEntries.length,'Meals logged')}
  </div>
  `;
}
function statTile(icon, color, num, label, dotOnly){
  const iconHtml = dotOnly
    ? `<div class="stat-icon" style="background:rgba(255,255,255,0.04);"><span style="width:9px;height:9px;border-radius:50%;background:${color};display:block;"></span></div>`
    : `<div class="stat-icon" style="background:rgba(255,255,255,0.05); color:${color};">${icon}</div>`;
  return `<div class="glass stat-tile">${iconHtml}<div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`;
}
function animateWeeklyVisuals(){
  document.querySelectorAll('.wbar').forEach(el=>{
    const h = parseFloat(el.dataset.h);
    const chartH = 120;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      el.setAttribute('height', h);
      el.setAttribute('y', chartH-h);
    }); });
  });
}

// ---------- events ----------
function attachHandlers(){
  const app = document.getElementById('app');
  app.onclick = async (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action==='switch-tab'){ currentTab = el.dataset.tab; render(); }
    else if(action==='date-prev'){ currentDate = shiftDate(currentDate,-1); render(); }
    else if(action==='date-next'){ currentDate = shiftDate(currentDate,1); render(); }
    else if(action==='fab-add'){ openAddModal('breakfast'); }
    else if(action==='open-add'){ openAddModal(el.dataset.meal); }
    else if(action==='edit-entry'){ openEditModal(el.dataset.id); }
    else if(action==='delete-entry'){ e.stopPropagation(); await deleteEntry(el.dataset.id); }
    else if(action==='close-sheet'){ closeSheet(); }
    else if(action==='overlay-close'){ if(e.target===el) closeSheet(); }
    else if(action==='trigger-file'){ document.getElementById('photoInput').click(); }
    else if(action==='go-manual'){ sheetStep='manual'; sheetResult = sheetResult || {name:'',portion:'',calories:0,protein:0,carbs:0,fat:0}; render(); }
    else if(action==='retry-analyze'){ analyzePhoto(); }
    else if(action==='pick-meal'){ sheetMeal = el.dataset.meal; render(); }
    else if(action==='confirm-add'){ await confirmAdd(); }
    else if(action==='save-goals'){ await saveGoalsFromForm(); }
    else if(action==='auto-macros'){ autoMacros(); }
    else if(action==='calc-calories'){ caloriesFromMacros(); }
    else if(action==='clear-data'){ await clearAllData(); }
    else if(action==='save-key'){ await saveApiKey(); }
    else if(action==='remove-key'){ await removeApiKey(); }
    else if(action==='save-gemini-key'){ await saveGeminiKey(); }
    else if(action==='remove-gemini-key'){ await removeGeminiKey(); }
    else if(action==='step'){ stepValue(el.dataset.target, Number(el.dataset.dir)); }
  };

  const slider = document.getElementById('goal-calories');
  if(slider){
    slider.addEventListener('input', ()=>{
      document.getElementById('calSliderNum').textContent = slider.value;
    });
  }
  ['goal-protein','goal-carbs','goal-fat'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.addEventListener('input', ()=>{ if(Number(el.value)<0) el.value = 0; }); }
  });
}

function stepValue(id, dir){
  const el = document.getElementById(id);

  const step = 5;
  let v = Number(el.value)||0;
  v = Math.max(0, v + dir*step);
  el.value = v;
}

const NUTRITION_PROMPT = `You are a nutrition estimation assistant. Analyze the food in this photo and respond with ONLY valid JSON, no markdown fences, no commentary, in exactly this shape:
{"items":[{"name":"string","portion":"string"}],"calories":number,"protein_g":number,"carbs_g":number,"fat_g":number,"confidence":"low|medium|high","note":"short string, 12 words max"}
Estimate totals for the ENTIRE meal shown (sum of all visible food items), using typical portion sizes for what's visible. Be realistic, not overly precise.`;

async function callGemini(){
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { inline_data: { mime_type: "image/jpeg", data: sheetImageBase64 } },
          { text: NUTRITION_PROMPT }
        ]
      }],
      generationConfig: { response_mime_type: "application/json" }
    })
  });
  if(!response.ok){
    if(response.status===400 || response.status===403){
      throw new Error("Gemini API key was rejected. Double-check it in the Goals tab.");
    }
    if(response.status===429){
      throw new Error("Gemini free tier rate limit hit. Try again in a moment, or enter manually.");
    }
    throw new Error(`Analysis request failed (${response.status}).`);
  }
  const data = await response.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text) throw new Error('No response from analysis.');
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(clean);
}

async function callAnthropic(){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: sheetImageBase64 } },
          { type: "text", text: NUTRITION_PROMPT }
        ]
      }]
    })
  });
  if(!response.ok){
    if(response.status===401){
      throw new Error("Anthropic API key was rejected. Double-check it in the Goals tab.");
    }
    throw new Error(`Analysis request failed (${response.status}).`);
  }
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No response from analysis.');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(clean);
}

async function analyzePhoto(){
  if(!geminiApiKey && !apiKey){
    sheetError = "No API key set. Go to the Goals tab and add a free Google Gemini key (recommended) to enable photo analysis.";
    sheetStep = 'error';
    render();
    return;
  }
  sheetStep = 'analyzing';
  render();
  try{
    const parsed = geminiApiKey ? await callGemini() : await callAnthropic();

    const itemsText = (parsed.items||[]).map(it=>it.portion? `${it.name} (${it.portion})` : it.name).join(', ');
    sheetResult = {
      name: (parsed.items && parsed.items.length) ? parsed.items.map(it=>it.name).join(', ') : 'Meal',
      portion: (parsed.items && parsed.items.length===1) ? (parsed.items[0].portion||'') : '',
      calories: Number(parsed.calories)||0,
      protein: Number(parsed.protein_g)||0,
      carbs: Number(parsed.carbs_g)||0,
      fat: Number(parsed.fat_g)||0,
      itemsText: itemsText,
      note: parsed.note || ''
    };
    sheetStep = 'result';
    render();
  }catch(err){
    console.error('analysis failed', err);
    sheetError = (err && err.message && (err.message.includes('API key') || err.message.includes('request failed') || err.message.includes('rate limit')))
      ? err.message
      : "Couldn't estimate this photo. You can try again or enter the meal manually.";
    sheetStep = 'error';
    render();
  }
}

  document.getElementById('goal-carbs').value = Math.round((cal*0.40)/4);
  document.getElementById('goal-fat').value = Math.round((cal*0.30)/9);

function caloriesFromMacros(){
  const protein = Number(document.getElementById('goal-protein').value)||0;
  const carbs = Number(document.getElementById('goal-carbs').value)||0;
  const fat = Number(document.getElementById('goal-fat').value)||0;
  const cal = Math.round(protein*4 + carbs*4 + fat*9);
  const slider = document.getElementById('goal-calories');
  const clamped = Math.min(4000, Math.max(1000, cal));
  slider.value = clamped;
  document.getElementById('calSliderNum').textContent = clamped;
  if(cal !== clamped){
    showToast(`Calculated ${cal} kcal (capped to slider range)`);
  } else {
    showToast(`Calories set to ${cal} kcal`);
  }
}

  await saveGeminiKeyToStorage('');
  showToast('Gemini key removed');
  render();
}

async function init(){
  goals = await loadGoals();
  entries = await loadEntries();
  apiKey = await loadApiKey();
  geminiApiKey = await loadGeminiKey();
  render();
}
init();

})();
</script>
